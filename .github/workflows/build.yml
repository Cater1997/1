name: 🚀 编译 (Build)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: "使用 ssh 连接到编译环境 (Connect to the build environment using ssh)"
        type: boolean
        default: false
      multithreading:
        description: "开启多线程编译 (Enable multithreading build)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build)
    steps:
      - name: 检查服务器配置
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo "云编译建议取消勾选Node.js及其相关插件！"
          echo "已知CPU型号（降序）：8370C,8272CL,8171M,E5系列"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
          echo -e "CPU核心及版本信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          sudo lshw -short -C memory | grep GiB
          echo -e "\n"
          echo "--------------------------硬盘信息--------------------------"
          echo -e  "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
          echo "硬盘详情："
          df -Th

      - name: Optimize Disk Space
        uses: hugoalh/disk-space-optimizer-ghaction@main
        with:
          operate_async: true
          operate_sudo: true
          general_include: ".+"
          docker_include: ".+"
          docker_prune: true
          docker_clean: true
          apt_enable: true
          apt_prune: true
          apt_clean: true
          chocolatey_enable: true
          homebrew_enable: true
          homebrew_prune: true
          homebrew_clean: true
          npm_enable: true
          npm_prune: true
          npm_clean: true
          pipx_enable: true
          wmic_enable: true
          fs_enable: true
          os_swap: true

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@main
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: 下载编译所需的依赖 (Install the software packages required for compilation)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt update
          sudo apt full-upgrade -y
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar file flex g++-multilib gawk gcc-multilib gettext git gnutls-dev gperf haveged help2man intltool jq libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev llvm lrzsz ninja-build p7zip p7zip-full patch pkgconf python3 python3-docutils python3-pip python3-ply python3-pyelftools python3-setuptools qemu-utils re2c rename rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip upx-ucl wget xmlto xxd zlib1g-dev zstd
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: 安装 Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source "$HOME/.cargo/env"
          rustup default nightly
          rustup component add rust-src
          rustc --version
          cargo --version

      - name: 安装 Go
        uses: actions/setup-go@main
        with:
           go-version: 'stable'
           check-latest: true
           token: ${{ github.token }}
           cache: true
           cache-dependency-path: 'go.sum'
           architecture: 'x64'

      - name: 安装 Node.js
        uses: actions/setup-node@main
        with:
          node-version: 'lts/*'
          check-latest: true
          architecture: 'x64'
          token: ${{ github.server_url == 'https://github.com' && github.token || '' }}
          cache: 'npm'
          package-manager-cache: true

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@main

      - name: 克隆 immortalwrt 仓库 (Clone immortalwrt repo)
        uses: actions/checkout@main
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          path: immortalwrt

      - name: 复制当前仓库的配置文件到 immortalwrt 仓库  (Copy current repo config to immortalwrt repo)
        run: cp -f diy-feeds.sh diy-config.sh immortalwrt/

      - name: 运行 diy-feeds.sh (Run diy-feeds.sh)
        working-directory: immortalwrt
        run: |
          chmod +x diy-feeds.sh
          ./diy-feeds.sh

      - name: 更新并下载 feeds (Update and download feeds)
        working-directory: immortalwrt
        run: ./scripts/feeds update -a
             rm ./package/feeds/packages/node
             rm ./package/feeds/packages/node-*
             ./scripts/feeds install -a

      - name: 运行 diy-config.sh (Run diy-config.sh)
        working-directory: immortalwrt
        run: |
          make defconfig
          chmod +x diy-config.sh
          ./diy-config.sh

      - name: 设置 Rust 环境变量
        run: |
          echo "RUSTC=$HOME/.cargo/bin/rustc" >> $GITHUB_ENV
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV
          echo "RUSTFLAGS=-Zbuild-std" >> $GITHUB_ENV

      - name: 检查 Rust 配置
        working-directory: immortalwrt
        run: |
          grep -E "CONFIG_RUSTC_(EXTERNAL|BUILD_STD)" .config || echo "Not found"
          grep "CONFIG_RUSTC=" .config
          grep "CONFIG_CARGO=" .config

      - name: 使用 ssh 连接到编译环境，限时15分钟，可在连接后输入命令 `touch /tmp/keepalive` 保活 (Connect to the build environment using ssh)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh }}
        uses: csexton/debugger-action@master

      - name: 下载软件源码包 (Download packages)
        working-directory: immortalwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -delete

      - name: 编译前上传配置 (Upload config before build)
        uses: actions/upload-artifact@main
        with:
          name: config-before-build
          path: |
            immortalwrt/feeds.conf.default
            immortalwrt/.config
          include-hidden-files: true

      - name: 多线程编译 immortalwrt (Build immortalwrt multithreading)
        if: ${{inputs.multithreading == true}}
        working-directory: immortalwrt
        run: make -j$(nproc) V=s

      - name: 单线程编译 immortalwrt (Build immortalwrt single thread)
        if: ${{inputs.multithreading == false}}
        working-directory: immortalwrt
        run: make -j1 V=s
     
      - name: Package OpenWrt Firmware
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: immortalwrt/bin/targets/armsr/armv8/immortalwrt-armsr-armv8-generic-rootfs.tar.gz
          SCRIPT_REPO_URL: unifreq/openwrt_packit
          SCRIPT_REPO_BRANCH: master
          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: 6.1.y_6.6.y
          KERNEL_AUTO_LATEST: true
          PACKAGE_SOC: e52c
          OPENWRT_IP: 192.168.2.1
          GZIP_IMGS: auto
          SELECT_PACKITPATH: openwrt_packit
          SELECT_OUTPUTPATH: output
          SAVE_OPENWRT_ROOTFS: true
          SCRIPT_E52C: mk_rk3588s_e52c.sh
          SCRIPT_DIY_PATH: none
          CUSTOMIZE_RK3399: none
          WHOAMI: admin
          OPENWRT_VER: auto
          SW_FLOWOFFLOAD: 1
          HW_FLOWOFFLOAD: 0
          SFE_FLOW: 0
          ENABLE_WIFI_K504: 0
          ENABLE_WIFI_K510: 0
          DISTRIB_REVISION: R$(date +%m.%d)
          DISTRIB_DESCRIPTION: ImmortalWrt
   
      - name: 上传编译结果到 Artifact (Upload build result to Artifact)
        uses: actions/upload-artifact@main
        with:
          name: immortalwrt-build-result
          path: immortalwrt/bin/targets
